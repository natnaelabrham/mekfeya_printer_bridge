name: mekfeya_printer_bridge
description: Isolates dart:js_interop and mobile-only packages from web builds.
version: 1.1.0
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.1
  usb_serial: ^0.5.2
  http: ^1.2.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mekfeya.printer_bridge
        pluginClass: MekfeyaPrinterBridgePlugin
